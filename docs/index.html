<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Niger Laptops – Votre boutique de consommables informatiques à Niamey">
    <meta name="keywords" content="ordinateur, laptop, niger, informatique, technologie, accessoires">
    <meta name="author" content="Hamadine AG MOCTAR - HAM Global Words">
    <meta name="copyright" content="HAM Global Words 2026">
    <meta name="theme-color" content="#0066CC">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Niger Laptops">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://unpkg.com">

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

    <!-- Manifest PWA -->
    <link rel="manifest" href="assets/site.webmanifest?v=2">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Niger Laptops",
        "url": "https://www.nigerlaptops.com",
        "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+227-86-76-29-03",
            "contactType": "Customer Service",
            "email": "hamadineagmoctar@gmail.com"
        }
    }
    </script>

    <link rel="stylesheet" href="css/styles.css">

    <title>Niger Laptops – Informatique & Technologie au Niger</title>
</head>
<body>
    <!-- Barre d'outils unifiée -->
    <header class="toolbar">
        <div class="toolbar-left">
            <select id="lang-selector" class="toolbar-select" aria-label="Langue">
                <option value="fr">🇫🇷 FR</option>
                <option value="en">🇬🇧 EN</option>
            </select>
        </div>
        <div class="toolbar-right">
            <button id="theme-toggle" class="toolbar-btn" title="Mode sombre" aria-label="Mode sombre">
                <i class="fas fa-moon"></i>
            </button>
            <button id="high-contrast-toggle" class="toolbar-btn" title="Contraste élevé" aria-label="Contraste élevé">
                <i class="fas fa-adjust"></i>
            </button>
            <button id="font-decrease" class="toolbar-btn" title="Diminuer la taille du texte" aria-label="Texte plus petit">A−</button>
            <button id="font-increase" class="toolbar-btn" title="Augmenter la taille du texte" aria-label="Texte plus grand">A+</button>
            <button id="font-reset" class="toolbar-btn" title="Taille du texte par défaut" aria-label="Réinitialiser la taille">
                <i class="fas fa-undo-alt"></i>
            </button>
        </div>
    </header>

    <div id="app">
        <!-- Contenu généré dynamiquement par app.js -->
    </div>

    <!-- Pied de page (généré par renderFooter()) -->
    <div id="footer-app"></div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/i18n.js"></script>        <!-- Traductions en premier -->
    <script src="js/theme.js"></script>
    <script src="js/install.js"></script>
    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/payments.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

    <!-- Enregistrement du Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(function(registration) {
                    console.log('Service Worker enregistré avec succès, scope :', registration.scope);
                })
                .catch(function(error) {
                    console.error('Erreur lors de l\'enregistrement du Service Worker :', error);
                });
        }
    </script>
    
</body>
</html>
